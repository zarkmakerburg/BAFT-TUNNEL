[package]
name = "baft-tunnel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Authenticated TCP forwarding for BAFT-TUNNEL"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = "0.4"
libc = "0.2"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snow = "0.9.6"
tokio = { version = "1.48", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-yamux = "0.3.20"
x509-parser = "=0.16.0"

[dev-dependencies]
rcgen = "=0.14.4"
