name: Phase 0 read-only inventory (existing two LAB hosts)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type READ_ONLY_INVENTORY to authorize metadata inspection of both existing LAB hosts
        required: true
        type: string
        default: ''

permissions:
  contents: read

# Shared lock prevents inventory reads from overlapping state-changing LAB workflows.
concurrency:
  group: baft-tunnel-trusted-lab-hosts
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require explicit read-only inventory confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == READ_ONLY_INVENTORY ]] || {
            echo 'Invalid confirmation. No LAB hosts were contacted.' >&2
            exit 2
          }

  two-host-inventory:
    needs: validate-confirmation
    runs-on: ubuntu-24.04
    environment: baft-tunnel-lab
    timeout-minutes: 15
    env:
      LAB_IRAN_HOST: ${{ secrets.LAB_IRAN_HOST }}
      LAB_ABROAD_HOST: ${{ secrets.LAB_ABROAD_HOST }}
      LAB_IRAN_SSH_USER: ${{ vars.LAB_IRAN_SSH_USER }}
      LAB_ABROAD_SSH_USER: ${{ vars.LAB_ABROAD_SSH_USER }}
      LAB_IRAN_SSH_PORT: ${{ vars.LAB_IRAN_SSH_PORT }}
      LAB_ABROAD_SSH_PORT: ${{ vars.LAB_ABROAD_SSH_PORT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare ephemeral SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing LAB_SSH_PRIVATE_KEY' >&2; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing LAB_SSH_KNOWN_HOSTS' >&2; exit 2; }
          test -n "$LAB_IRAN_HOST" || { echo 'Missing LAB_IRAN_HOST' >&2; exit 2; }
          test -n "$LAB_ABROAD_HOST" || { echo 'Missing LAB_ABROAD_HOST' >&2; exit 2; }
          echo "::add-mask::$LAB_IRAN_HOST"
          echo "::add-mask::$LAB_ABROAD_HOST"
          install -d -m 0700 "$RUNNER_TEMP/baft-tunnel-inventory-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/baft-tunnel-inventory-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/baft-tunnel-inventory-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/baft-tunnel-inventory-ssh/id_ed25519" "$RUNNER_TEMP/baft-tunnel-inventory-ssh/known_hosts"
          echo "SSH_KEY_FILE=$RUNNER_TEMP/baft-tunnel-inventory-ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/baft-tunnel-inventory-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Inspect both hosts without changing remote state
        run: bash lab/real-hosts/read-only-inventory-two-hosts.sh
      - name: Remove ephemeral credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/baft-tunnel-inventory-ssh"
