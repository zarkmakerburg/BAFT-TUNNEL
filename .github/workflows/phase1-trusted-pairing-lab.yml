name: Phase 1 trusted two-host automatic pairing LAB

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit SHA represented by the signed v0.3.1-rc.1 release binary
        required: true
        type: string
      confirm:
        description: Type RUN_TRUSTED_PHASE1_LAB to authorize the isolated automatic pairing two-host test (Direct, then Reverse Preview)
        required: true
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: baft-tunnel-trusted-lab-hosts
  cancel-in-progress: false

jobs:
  validate-candidate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Require explicit approval and immutable RC.1 candidate
        env:
          CONFIRM: ${{ inputs.confirm }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_RELEASE_TAG: v0.3.1-rc.1
          EXPECTED_CANDIDATE_SHA: 4c2a5bc306030e647e4f62b009082ff7fa8fe096
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == RUN_TRUSTED_PHASE1_LAB ]] || { echo 'Explicit confirmation is required' >&2; exit 2; }
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase 40-character SHA' >&2; exit 2; }
          [[ "$REQUESTED_SHA" == "$EXPECTED_CANDIDATE_SHA" ]] || {
            echo "::error::only the reviewed v0.3.1-rc.1 candidate is authorized by this workflow"; exit 2;
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the immutable release tag against trusted main
        id: candidate
        env:
          EXPECTED_RELEASE_TAG: v0.3.1-rc.1
          EXPECTED_CANDIDATE_SHA: 4c2a5bc306030e647e4f62b009082ff7fa8fe096
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$EXPECTED_RELEASE_TAG:refs/tags/$EXPECTED_RELEASE_TAG"
          actual="$(git rev-parse --verify "$EXPECTED_RELEASE_TAG^{commit}")"
          [[ "$actual" == "$EXPECTED_CANDIDATE_SHA" ]] || {
            echo "::error::release tag target changed: expected $EXPECTED_CANDIDATE_SHA, got $actual"; exit 2;
          }
          git merge-base --is-ancestor "$actual" "$GITHUB_SHA" || {
            echo "::error::RC.1 is not contained in the trusted main commit"; exit 2;
          }
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          {
            echo "PAIRING_CANDIDATE_TAG=$EXPECTED_RELEASE_TAG"
            echo "PAIRING_CANDIDATE_SHA=$actual"
            echo "The Git tag is unsigned; the release binary and checksum manifest are verified separately with Sigstore."
          } >> "$GITHUB_STEP_SUMMARY"

  verify-signed-release:
    needs: validate-candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download the exact RC.1 release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.1-rc.1
          ASSET: baft-tunnel-v0.3.1-rc.1-linux-x86_64
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/rc1-release"
          mkdir -p "$release_dir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$release_dir" \
            --pattern "$ASSET" \
            --pattern SHA256SUMS \
            --pattern SHA256SUMS.cosign.bundle
          for f in "$ASSET" SHA256SUMS SHA256SUMS.cosign.bundle; do
            [[ -f "$release_dir/$f" && ! -L "$release_dir/$f" ]] || {
              echo "::error::missing or unsafe release asset: $f"; exit 2;
            }
          done
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.3
      - name: Verify the release signature and exact binary digest
        env:
          TAG: v0.3.1-rc.1
          ASSET: baft-tunnel-v0.3.1-rc.1-linux-x86_64
          EXPECTED_BINARY_SHA256: 38404ee3b5317a8a6c37b84e75d0d5f9dd6fc45b50266467fb261d6d6410aa9d
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc1-release"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.cosign.bundle \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          manifest_entries="$(awk -v asset="$ASSET" '$2 == asset { count++ } END { print count+0 }' SHA256SUMS)"
          [[ "$manifest_entries" == 1 ]] || {
            echo "::error::signed SHA256SUMS must contain exactly one digest for $ASSET"; exit 2;
          }
          sha256sum --check --ignore-missing SHA256SUMS
          actual_binary_sha256="$(sha256sum "$ASSET" | awk '{print $1}')"
          [[ "$actual_binary_sha256" == "$EXPECTED_BINARY_SHA256" ]] || {
            echo "::error::RC.1 binary digest differs from the pinned release asset"; exit 2;
          }
          install -D -m 0755 "$ASSET" "$RUNNER_TEMP/baft-tunnel"
          "$RUNNER_TEMP/baft-tunnel" --version
          echo "PAIRING_BINARY_SHA256=$(sha256sum "$RUNNER_TEMP/baft-tunnel" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the verified release binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: baft-tunnel-pairing-candidate-${{ needs.validate-candidate.outputs.candidate_sha }}
          path: ${{ runner.temp }}/baft-tunnel
          if-no-files-found: error
          retention-days: 1

  auto-pair-two-host-lab:
    needs: [validate-candidate, verify-signed-release]
    runs-on: ubuntu-22.04
    environment: baft-tunnel-lab
    timeout-minutes: 40
    steps:
      # Trusted main scripts orchestrate the test. Only the separately verified release binary is imported.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4.3.0
        with:
          name: baft-tunnel-pairing-candidate-${{ needs.validate-candidate.outputs.candidate_sha }}
          path: ${{ runner.temp }}/baft-tunnel-pairing-candidate
      - name: Run automatic pairing (agent API, root helper, pair worker) on both hosts (Direct, then Reverse Preview)
        env:
          LAB_IRAN_HOST: ${{ secrets.LAB_IRAN_HOST }}
          LAB_ABROAD_HOST: ${{ secrets.LAB_ABROAD_HOST }}
          LAB_SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          LAB_SSH_KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
          LAB_IRAN_SSH_USER: ${{ vars.LAB_IRAN_SSH_USER }}
          LAB_ABROAD_SSH_USER: ${{ vars.LAB_ABROAD_SSH_USER }}
          LAB_IRAN_SSH_PORT: ${{ vars.LAB_IRAN_SSH_PORT }}
          LAB_ABROAD_SSH_PORT: ${{ vars.LAB_ABROAD_SSH_PORT }}
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/baft-tunnel-pairing-candidate/baft-tunnel"
          [[ -f "$candidate" && ! -L "$candidate" ]] || { echo 'verified candidate binary missing' >&2; exit 2; }
          install -D -m 0755 "$candidate" target/release/baft-tunnel
          printf '%s\n' "$LAB_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/pairing-lab-id_ed25519"
          printf '%s\n' "$LAB_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/pairing-lab-known_hosts"
          chmod 600 "$RUNNER_TEMP/pairing-lab-id_ed25519" "$RUNNER_TEMP/pairing-lab-known_hosts"
          unset LAB_SSH_PRIVATE_KEY LAB_SSH_KNOWN_HOSTS
          export SSH_KEY_FILE="$RUNNER_TEMP/pairing-lab-id_ed25519"
          export SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/pairing-lab-known_hosts"
          export MVP_BINARY="$PWD/target/release/baft-tunnel"
          export BAFT_TUNNEL_BINARY="$PWD/target/release/baft-tunnel"
          export MVP_SOURCE="$CANDIDATE_SHA"
          export LAB_SOAK_SECONDS=0 LAB_IMPAIR=0 LAB_SETUP=0 LAB_ROLLOVER=0
          export LAB_REVERSE=0 LAB_MVP=0 LAB_OPS=0 LAB_AGENT_SVC=0
          export LAB_AUTO_PAIR=1
          trap 'rm -f "$RUNNER_TEMP/pairing-lab-id_ed25519" "$RUNNER_TEMP/pairing-lab-known_hosts"' EXIT
          bash lab/real-hosts/phase1-two-host-e2e.sh
