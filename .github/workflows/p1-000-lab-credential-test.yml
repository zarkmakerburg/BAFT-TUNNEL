name: P1-000 LAB credential test (manual, isolated)

on:
  push:
    # Registers the workflow for dispatch from this branch; the confirmation gate
    # fails a push run before any LAB host is contacted. Remove before merging.
    branches:
      - claude/project-thread-bj8i5o
    paths:
      - .github/workflows/p1-000-lab-credential-test.yml
  workflow_dispatch:
    inputs:
      confirm:
        description: Type P1_000_ISOLATED_CREDENTIAL_TEST to run the isolated LoadCredential= test on both LAB hosts
        required: true
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: baft-tunnel-phase0-two-host-lab
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != "P1_000_ISOLATED_CREDENTIAL_TEST" ]]; then
            echo "Invalid confirmation. No LAB hosts were contacted." >&2
            exit 2
          fi

  lab-test:
    needs: validate-confirmation
    # Built on Ubuntu 22.04 so the binary matches the LAB glibc baseline.
    runs-on: ubuntu-22.04
    environment: baft-tunnel-lab
    timeout-minutes: 20
    env:
      LAB_IRAN_HOST: ${{ vars.LAB_IRAN_HOST }}
      LAB_ABROAD_HOST: ${{ vars.LAB_ABROAD_HOST }}
      LAB_IRAN_SSH_USER: ${{ vars.LAB_IRAN_SSH_USER }}
      LAB_ABROAD_SSH_USER: ${{ vars.LAB_ABROAD_SSH_USER }}
      LAB_IRAN_SSH_PORT: ${{ vars.LAB_IRAN_SSH_PORT }}
      LAB_ABROAD_SSH_PORT: ${{ vars.LAB_ABROAD_SSH_PORT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Build release binary
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 build --locked --release
          mkdir -p bin && cp target/release/baft-tunnel bin/
      - name: Prepare ephemeral SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS" && test -n "$LAB_IRAN_HOST" && test -n "$LAB_ABROAD_HOST" || { echo 'Missing LAB secret or variable' >&2; exit 2; }
          echo "::add-mask::$LAB_IRAN_HOST"
          echo "::add-mask::$LAB_ABROAD_HOST"
          mkdir -p "$RUNNER_TEMP/baft-tunnel-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/baft-tunnel-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519" "$RUNNER_TEMP/baft-tunnel-ssh/known_hosts"
          chmod +x bin/baft-tunnel
          echo "SSH_KEY_FILE=$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/baft-tunnel-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Isolated credential test on Iran LAB host
        run: bash lab/real-hosts/p1-000-credential-lab.sh iran "$LAB_IRAN_HOST" "$LAB_IRAN_SSH_USER" "${LAB_IRAN_SSH_PORT:-22}" "$PWD/bin/baft-tunnel"
      - name: Isolated credential test on abroad LAB host
        run: bash lab/real-hosts/p1-000-credential-lab.sh abroad "$LAB_ABROAD_HOST" "$LAB_ABROAD_SSH_USER" "${LAB_ABROAD_SSH_PORT:-22}" "$PWD/bin/baft-tunnel"
      - name: Remove ephemeral credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/baft-tunnel-ssh"
