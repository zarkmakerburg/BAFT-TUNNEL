name: Phase 1 two-host LAB E2E (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN_PHASE1_E2E to start temporary tunnel tests on the two LAB hosts
        required: true
        type: string
        default: ''
      soak_seconds:
        description: Optional Direct soak duration in seconds (0-3600)
        required: false
        type: string
        default: '0'
      impair:
        description: Run application-level latency/jitter impairment (0 or 1)
        required: false
        type: string
        default: '0'
      loss_percent:
        description: Real TCP packet loss on the test flow only, via a temporary nftables table (0-20)
        required: false
        type: string
        default: '0'
      noise:
        description: Also run the noise-tcp engine stage (0 or 1)
        required: false
        type: string
        default: '0'
      baft:
        description: Also run the BAFT engine stage with the pinned Go engine (0 or 1)
        required: false
        type: string
        default: '0'
      baft_systemd:
        description: With baft=1, also run the BAFT stage under hardened transient systemd units (0 or 1)
        required: false
        type: string
        default: '0'
      baft_release:
        description: With baft=1, take the engine from this signed release tag (cosign + SHA256SUMS verified) instead of building it; empty = local build
        required: false
        type: string
        default: ''
      rollover:
        description: Also run the CA/pin rollover sequence stage (0 or 1)
        required: false
        type: string
        default: '0'
      setup:
        description: Also run the guided-setup stage (init/join/apply on clean directories, then engine switch) (0 or 1)
        required: false
        type: string
        default: '0'
      reverse:
        description: Also run the real Reverse stage (ADR-0021, tcp-tls; service node dials out) (0 or 1)
        required: false
        type: string
        default: '0'
      reverse_r3:
        description: With reverse=1, also run Reverse R3 (SIGKILL/replace cycles, 30 s blackhole, mid-transfer kill, loss_percent on the Reverse flow, cleanup) with this many soak seconds (0 = off, max 3600)
        required: false
        type: string
        default: '0'
      mvp:
        description: Run the P0-5 integrated MVP stage (clean install, setup, Apply start, refusals, uninstall) (0 or 1)
        required: false
        type: string
        default: '0'
      mvp_release:
        description: With mvp=1, install the baft-tunnel binary from this signed release tag (cosign + SHA256SUMS verified); empty = this run's local build
        required: false
        type: string
        default: ''
      reverse_accept:
        description: Reverse acceptance (installed product path, non-root units, backup/restore, update/rollback) with this many soak seconds (0 = off, max 3600); run alone
        required: false
        type: string
        default: '0'
      ops_stage:
        description: Direct operations stage (installed product path, non-root units, backup/restore, update/rollback) with this many soak seconds (0 = off, max 3600); run alone
        required: false
        type: string
        default: '0'
      cleanup_stale:
        description: Only remove leftovers of earlier runs of this test (0 = no, 1 = temp processes/dirs, 2 = also an installed BAFT-TUNNEL from an interrupted Reverse acceptance run)
        required: false
        type: string
        default: '0'
      crl_push:
        description: With ops_stage, also renew the CRL (renew-crl) and push it to both nodes with push-crl.sh (0 or 1)
        required: false
        type: string
        default: '0'
      agent_service:
        description: Agent service + tunnel lifecycle stage (install --register, agent self-start, Start/Restart/Stop via the agent, uninstall) (0 or 1); run alone
        required: false
        type: string
        default: '0'
      panel_pairing:
        description: Panel pairing stage (install --register, both nodes set up through the agent API and the root setup helper only, Start, uninstall) (0 or 1); run alone
        required: false
        type: string
        default: '0'
      panel_engine:
        description: Engine used by panel_pairing; tcp-tls additionally exercises panel CSR recovery and offline CA certificate import
        required: false
        type: choice
        options:
          - noise-tcp
          - tcp-tls
        default: noise-tcp
      reboot:
        description: With agent_service=1, reboot both LAB hosts once and verify the agent and tunnel come back by themselves (0 or 1; owner approval required)
        required: false
        type: string
        default: '0'
      ref:
        description: Optional ref override; empty uses the same ref that supplied this workflow (restricted to main, D2 candidate, or audited PR #151 branch)
        required: false
        type: string
        default: ''
      validation_only:
        description: Run candidate validation (format, Rust tests, Clippy, installer, panel and offline CA) without contacting LAB hosts or using LAB SSH secrets
        required: false
        type: string
        default: '0'

permissions:
  contents: read

concurrency:
  group: baft-tunnel-phase1-two-host-e2e
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require explicit E2E confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          if [[ "$CONFIRM" != "RUN_PHASE1_E2E" ]]; then
            echo "Invalid confirmation. No LAB hosts were contacted." >&2
            exit 2
          fi
          if [[ "$REF" != "main" && "$REF" != "feature/d2-panel-tcp-tls-enrollment" && "$REF" != "audit/pr150-remediation-2026-11-10" ]]; then
            echo "Only main, the reviewed D2 enrollment candidate, or the audited PR #151 remediation branch may be tested." >&2
            exit 2
          fi

  validate-d2-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          persist-credentials: false
      - name: Resolve immutable candidate commit
        id: candidate
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify HEAD^{commit})"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Candidate SHA: $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Run full Rust test suite
        run: cargo +1.88.0 test --locked --all-targets
      - name: Run Clippy
        run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings
      - name: Validate staged installer and rollback
        run: bash scripts/test-install.sh
      - name: Validate quick installer contract and negative verification paths
        run: bash scripts/test-quick-install.sh
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/baft-panel-qa" --no-save --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/baft-panel-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validate panel JavaScript, D2 LAB contract and bilingual enrollment
        env:
          NODE_PATH: ${{ runner.temp }}/baft-panel-qa/node_modules
        run: |
          node --check panel/pages.js
          node --check panel/i18n.js
          bash scripts/pki/test-panel-tls-lab-stage.sh
          node scripts/panel-qa/pki-enrollment.js
      - name: Validate network-isolated offline CA container
        run: bash scripts/pki/test-offline-ca-container.sh

  two-host-e2e:
    if: ${{ inputs.validation_only != '1' }}
    needs: [validate-confirmation, validate-d2-candidate]
    runs-on: ubuntu-22.04
    environment: baft-tunnel-lab
    timeout-minutes: 90
    env:
      LAB_IRAN_HOST: ${{ secrets.LAB_IRAN_HOST }}
      LAB_ABROAD_HOST: ${{ secrets.LAB_ABROAD_HOST }}
      LAB_IRAN_SSH_USER: ${{ vars.LAB_IRAN_SSH_USER }}
      LAB_ABROAD_SSH_USER: ${{ vars.LAB_ABROAD_SSH_USER }}
      LAB_IRAN_SSH_PORT: ${{ vars.LAB_IRAN_SSH_PORT }}
      LAB_ABROAD_SSH_PORT: ${{ vars.LAB_ABROAD_SSH_PORT }}
      LAB_SOAK_SECONDS: ${{ inputs.soak_seconds }}
      LAB_IMPAIR: ${{ inputs.impair }}
      LAB_LOSS_PERCENT: ${{ inputs.loss_percent }}
      LAB_NOISE: ${{ inputs.noise }}
      LAB_BAFT: ${{ inputs.baft }}
      LAB_REVERSE: ${{ inputs.reverse }}
      LAB_REVERSE_R3: ${{ inputs.reverse_r3 }}
      LAB_MVP: ${{ inputs.mvp }}
      LAB_REVERSE_ACCEPT: ${{ inputs.reverse_accept }}
      LAB_OPS: ${{ inputs.ops_stage }}
      LAB_CRL_PUSH: ${{ inputs.crl_push }}
      LAB_AGENT_SVC: ${{ inputs.agent_service }}
      LAB_REBOOT: ${{ inputs.reboot }}
      LAB_PANEL_PAIRING: ${{ inputs.panel_pairing }}
      LAB_PANEL_ENGINE: ${{ inputs.panel_engine }}
      LAB_BAFT_SYSTEMD: ${{ inputs.baft_systemd }}
      LAB_ROLLOVER: ${{ inputs.rollover }}
      LAB_SETUP: ${{ inputs.setup }}
      LAB_CLEANUP_STALE: ${{ inputs.cleanup_stale }}
      LAB_E2E_PORT: '18300'
      LAB_E2E_LOCAL_PORT: '18080'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ needs.validate-d2-candidate.outputs.candidate_sha }}
          persist-credentials: false
      - name: Assert exact candidate SHA from validation job
        env:
          EXPECTED_SHA: ${{ needs.validate-d2-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          echo "Two-host LAB candidate SHA: $actual"
          [[ -n "$EXPECTED_SHA" && "$actual" == "$EXPECTED_SHA" ]]
          echo "LAB_CANDIDATE_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build Linux release binary
        run: cargo +1.88.0 build --locked --release
      - name: Build the pinned BAFT engine (only for the BAFT stage, no release tag given)
        if: ${{ inputs.baft == '1' && inputs.baft_release == '' }}
        run: |
          set -euo pipefail
          . release/baft-engine.pin
          scripts/build-baft-engine.sh "$RUNNER_TEMP/baft-out" >/dev/null
          cp "$RUNNER_TEMP/baft-out/baft" "$RUNNER_TEMP/baft-engine"
          echo "BAFT_ENGINE_BINARY=$RUNNER_TEMP/baft-engine" >> "$GITHUB_ENV"
          echo "BAFT_ENGINE_SOURCE=local-build" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        if: ${{ inputs.baft == '1' && inputs.baft_release != '' }}
        with:
          cosign-release: v2.5.3
      - name: Fetch and verify the BAFT engine from a signed release
        if: ${{ inputs.baft == '1' && inputs.baft_release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.baft_release }}
          ID: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]] || { echo "invalid release tag" >&2; exit 2; }
          d="$RUNNER_TEMP/baft-release"; mkdir -p "$d"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$d" \
            --pattern SHA256SUMS --pattern SHA256SUMS.cosign.bundle --pattern "baft-engine-${TAG}-linux-amd64"
          cosign verify-blob "$d/SHA256SUMS" --bundle "$d/SHA256SUMS.cosign.bundle" \
            --certificate-identity "${ID}@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          (cd "$d" && sha256sum -c --ignore-missing SHA256SUMS | grep -q "baft-engine-${TAG}-linux-amd64: OK")
          # Negative controls: another repository's workflow, a feature branch, or main, must not verify.
          if cosign verify-blob "$d/SHA256SUMS" --bundle "$d/SHA256SUMS.cosign.bundle" \
            --certificate-identity "https://github.com/other-owner/other-repo/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
            echo "::error::signature verified under a foreign repository identity"; exit 1; fi
          if cosign verify-blob "$d/SHA256SUMS" --bundle "$d/SHA256SUMS.cosign.bundle" \
            --certificate-identity "${ID}@refs/heads/some-feature-branch" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
            echo "::error::signature verified under a feature-branch ref"; exit 1; fi
          if cosign verify-blob "$d/SHA256SUMS" --bundle "$d/SHA256SUMS.cosign.bundle" \
            --certificate-identity "${ID}@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
            echo "::error::signature verified under a branch identity"; exit 1; fi
          echo "COSIGN_IDENTITY_NEGATIVES=PASS"
          want="$(python3 -c 'import json;m=json.load(open("release/engine-manifest.json"));print([e for e in m["engines"] if e["id"]=="baft"][0]["artifact_sha256"])')"
          have="$(sha256sum "$d/baft-engine-${TAG}-linux-amd64" | cut -d' ' -f1)"
          [ "$want" = "$have" ] || { echo "::error::release engine $have is not the engine-manifest.json pin $want"; exit 1; }
          install -m 755 "$d/baft-engine-${TAG}-linux-amd64" "$RUNNER_TEMP/baft-engine"
          echo "BAFT_ENGINE_BINARY=$RUNNER_TEMP/baft-engine" >> "$GITHUB_ENV"
          echo "BAFT_ENGINE_SOURCE=signed-release:${TAG}" >> "$GITHUB_ENV"
      - name: Use this run's local build for the MVP stage (no release tag given)
        if: ${{ (inputs.mvp == '1' || inputs.reverse_accept != '0' || inputs.ops_stage != '0' || inputs.agent_service == '1' || inputs.panel_pairing == '1') && inputs.mvp_release == '' }}
        run: |
          echo "MVP_BINARY=$GITHUB_WORKSPACE/target/release/baft-tunnel" >> "$GITHUB_ENV"
          echo "MVP_SOURCE=local-build:$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        if: ${{ (inputs.mvp == '1' || inputs.reverse_accept != '0' || inputs.ops_stage != '0' || inputs.agent_service == '1' || inputs.panel_pairing == '1') && inputs.mvp_release != '' && inputs.baft_release == '' }}
        with:
          cosign-release: v2.5.3
      - name: Fetch and verify the baft-tunnel binary from a signed release (MVP stage)
        if: ${{ (inputs.mvp == '1' || inputs.reverse_accept != '0' || inputs.ops_stage != '0' || inputs.agent_service == '1' || inputs.panel_pairing == '1') && inputs.mvp_release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.mvp_release }}
          ID: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]] || { echo "invalid release tag" >&2; exit 2; }
          d="$RUNNER_TEMP/mvp-release"; mkdir -p "$d"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$d" \
            --pattern SHA256SUMS --pattern SHA256SUMS.cosign.bundle --pattern "baft-tunnel-${TAG}-linux-x86_64"
          cosign verify-blob "$d/SHA256SUMS" --bundle "$d/SHA256SUMS.cosign.bundle" \
            --certificate-identity "${ID}@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          (cd "$d" && sha256sum -c --ignore-missing SHA256SUMS | grep -q "baft-tunnel-${TAG}-linux-x86_64: OK")
          install -m 755 "$d/baft-tunnel-${TAG}-linux-x86_64" "$RUNNER_TEMP/baft-tunnel-mvp"
          echo "MVP_BINARY=$RUNNER_TEMP/baft-tunnel-mvp" >> "$GITHUB_ENV"
          echo "MVP_SOURCE=signed-release:${TAG}" >> "$GITHUB_ENV"
          # Releases from rc.6 on carry the install package (binary + scripts + units); older ones do not.
          pkg="baft-tunnel-${TAG}-linux-x86_64.tar.gz"
          if awk -v p="$pkg" '$2==p{f=1} END{exit !f}' "$d/SHA256SUMS"; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$d" --pattern "$pkg"
            (cd "$d" && sha256sum -c --ignore-missing SHA256SUMS | grep -qxF "${pkg}: OK")
            echo "MVP_PKG=$d/$pkg" >> "$GITHUB_ENV"
            echo "MVP_SOURCE=signed-release-package:${TAG}" >> "$GITHUB_ENV"
          fi
      - name: Prepare ephemeral SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing secret LAB_SSH_PRIVATE_KEY' >&2; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing secret LAB_SSH_KNOWN_HOSTS' >&2; exit 2; }
          mkdir -p "$RUNNER_TEMP/baft-tunnel-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/baft-tunnel-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519" "$RUNNER_TEMP/baft-tunnel-ssh/known_hosts"
          echo "SSH_KEY_FILE=$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/baft-tunnel-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Run temporary two-host E2E, optional Reverse stage and recovery
        run: bash lab/real-hosts/phase1-two-host-e2e.sh
      - name: Remove ephemeral runner credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/baft-tunnel-ssh"
