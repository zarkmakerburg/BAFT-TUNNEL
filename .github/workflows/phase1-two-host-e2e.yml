name: Phase 1 two-host LAB E2E (disabled legacy entrypoint)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: This legacy workflow is disabled. Use phase1-trusted-lab.yml from main.
        required: true
        type: string
        default: ''

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse the legacy secret-bearing workflow
        run: |
          echo 'This workflow is intentionally disabled because it executed candidate-controlled scripts in a secret-bearing job.' >&2
          echo 'Use the trusted Phase 1 LAB workflow from the protected main branch.' >&2
          exit 1
