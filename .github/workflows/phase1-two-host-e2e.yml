name: Phase 1 two-host LAB E2E (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN_PHASE1_E2E to start temporary Direct/Reverse tunnel tests on the two LAB hosts
        required: true
        type: string
        default: ''
      soak_seconds:
        description: Optional Direct soak duration in seconds (0-3600)
        required: false
        type: string
        default: '0'
      impair:
        description: Run application-level latency/jitter impairment (0 or 1)
        required: false
        type: string
        default: '0'
      loss_percent:
        description: Real TCP packet loss on the test flow only, via a temporary nftables table (0-20)
        required: false
        type: string
        default: '0'
      noise:
        description: Also run the noise-tcp engine stage (0 or 1)
        required: false
        type: string
        default: '0'
      baft:
        description: Also run the BAFT engine stage with the pinned Go engine (0 or 1)
        required: false
        type: string
        default: '0'
      rollover:
        description: Also run the CA/pin rollover sequence stage (0 or 1)
        required: false
        type: string
        default: '0'
      setup:
        description: Also run the guided-setup stage (init/join/apply on clean directories, then engine switch) (0 or 1)
        required: false
        type: string
        default: '0'
      cleanup_stale:
        description: Only remove leftover temp processes/dirs of earlier runs of this test (0 or 1)
        required: false
        type: string
        default: '0'
      ref:
        description: The Phase 1 branch to test (restricted to phase1/rust-tcp-transport)
        required: true
        type: string
        default: phase1/rust-tcp-transport

permissions:
  contents: read

concurrency:
  group: baft-tunnel-phase1-two-host-e2e
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require explicit E2E confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ inputs.ref }}
        run: |
          if [[ "$CONFIRM" != "RUN_PHASE1_E2E" ]]; then
            echo "Invalid confirmation. No LAB hosts were contacted." >&2
            exit 2
          fi
          if [[ "$REF" != "phase1/rust-tcp-transport" && "$REF" != "main" ]]; then
            echo "Only main or the reviewed Phase 1 branch may be tested." >&2
            exit 2
          fi

  two-host-e2e:
    needs: validate-confirmation
    runs-on: ubuntu-22.04
    environment: baft-tunnel-lab
    timeout-minutes: 90
    env:
      LAB_IRAN_HOST: ${{ secrets.LAB_IRAN_HOST }}
      LAB_ABROAD_HOST: ${{ secrets.LAB_ABROAD_HOST }}
      LAB_IRAN_SSH_USER: ${{ vars.LAB_IRAN_SSH_USER }}
      LAB_ABROAD_SSH_USER: ${{ vars.LAB_ABROAD_SSH_USER }}
      LAB_IRAN_SSH_PORT: ${{ vars.LAB_IRAN_SSH_PORT }}
      LAB_ABROAD_SSH_PORT: ${{ vars.LAB_ABROAD_SSH_PORT }}
      LAB_SOAK_SECONDS: ${{ inputs.soak_seconds }}
      LAB_IMPAIR: ${{ inputs.impair }}
      LAB_LOSS_PERCENT: ${{ inputs.loss_percent }}
      LAB_NOISE: ${{ inputs.noise }}
      LAB_BAFT: ${{ inputs.baft }}
      LAB_ROLLOVER: ${{ inputs.rollover }}
      LAB_SETUP: ${{ inputs.setup }}
      LAB_CLEANUP_STALE: ${{ inputs.cleanup_stale }}
      LAB_E2E_PORT: '18300'
      LAB_E2E_LOCAL_PORT: '18080'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build Linux release binary
        run: cargo +1.88.0 build --locked --release
      - name: Build the pinned BAFT engine (only for the BAFT stage)
        if: ${{ inputs.baft == '1' }}
        run: |
          set -euo pipefail
          . release/baft-engine.pin
          scripts/build-baft-engine.sh "$RUNNER_TEMP/baft-out" >/dev/null
          cp "$RUNNER_TEMP/baft-out/baft" "$RUNNER_TEMP/baft-engine"
          echo "BAFT_ENGINE_BINARY=$RUNNER_TEMP/baft-engine" >> "$GITHUB_ENV"
      - name: Prepare ephemeral SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing secret LAB_SSH_PRIVATE_KEY' >&2; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing secret LAB_SSH_KNOWN_HOSTS' >&2; exit 2; }
          mkdir -p "$RUNNER_TEMP/baft-tunnel-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/baft-tunnel-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519" "$RUNNER_TEMP/baft-tunnel-ssh/known_hosts"
          echo "SSH_KEY_FILE=$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/baft-tunnel-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Run temporary two-host Direct/Reverse E2E and recovery
        run: bash lab/real-hosts/phase1-two-host-e2e.sh
      - name: Remove ephemeral runner credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/baft-tunnel-ssh"
