name: phase0
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Validate POSIX shell scripts
        run: |
          set -eu
          for script in lab/scripts/apply-netem.sh lab/scripts/clear-netem.sh lab/scripts/show-netem.sh lab/scripts/test-scripts.sh lab/scripts/check-workflow-pins.sh lab/scripts/test-workflow-pins.sh; do
            sh -n "$script"
          done
      - name: Validate Bash scripts
        run: |
          set -eu
          for script in lab/scripts/integration-netem.sh lab/scripts/test-clear-netem.sh lab/real-hosts/*.sh scripts/pki/*.sh scripts/install.sh scripts/rollback.sh scripts/uninstall.sh scripts/test-install.sh; do
            bash -n "$script"
          done
      - name: Test staged install, rollback, and uninstall
        run: bash scripts/test-install.sh
      - name: Enforce immutable workflow action pins
        run: sh lab/scripts/check-workflow-pins.sh
      - name: Test workflow action pin policy (mock fixtures)
        run: sh lab/scripts/test-workflow-pins.sh
      - name: Test LAB control scripts
        run: sh lab/scripts/test-scripts.sh
      - name: Test NetEm cleanup failure paths (mock Docker only)
        run: bash lab/scripts/test-clear-netem.sh
      - name: Test six-host preflight guards (mock SSH only)
        run: bash lab/real-hosts/test-preflight-matrix.sh
      - name: Test Phase 1 two-host E2E orchestration (mock SSH/SCP only)
        run: bash lab/real-hosts/test-phase1-two-host-e2e.sh
      - name: Test offline PKI lifecycle (temporary CA only)
        run: bash scripts/pki/test.sh
      - name: Test guarded CRL update validation (temporary CAs only)
        run: bash scripts/pki/test-apply-crl.sh
      - name: Test CRL freshness report (temporary CAs only)
        run: bash scripts/pki/test-crl-status.sh
      - name: Test operator CRL push helper (mock SSH/SCP only)
        run: bash scripts/pki/test-push-crl.sh
      - name: Validate Docker Compose
        run: docker compose -f lab/compose.yaml config --quiet
      - name: Run isolated Docker netem integration
        run: bash lab/scripts/integration-netem.sh
