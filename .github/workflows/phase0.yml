name: phase0
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Validate POSIX shell scripts
        run: |
          set -eu
          for script in lab/scripts/apply-netem.sh lab/scripts/clear-netem.sh lab/scripts/show-netem.sh lab/scripts/test-scripts.sh; do
            sh -n "$script"
          done
      - name: Validate Bash scripts
        run: |
          set -eu
          for script in lab/scripts/integration-netem.sh lab/scripts/test-clear-netem.sh lab/real-hosts/*.sh; do
            bash -n "$script"
          done
      - name: Test LAB control scripts
        run: sh lab/scripts/test-scripts.sh
      - name: Test NetEm cleanup failure paths (mock Docker only)
        run: bash lab/scripts/test-clear-netem.sh
      - name: Test six-host preflight guards (mock SSH only)
        run: bash lab/real-hosts/test-preflight-matrix.sh
      - name: Validate Docker Compose
        run: docker compose -f lab/compose.yaml config --quiet
      - name: Run isolated Docker netem integration
        run: bash lab/scripts/integration-netem.sh
