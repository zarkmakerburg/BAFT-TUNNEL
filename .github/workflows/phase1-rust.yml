name: phase1-rust
on:
  pull_request:
    branches:
      - main
      - phase0/six-host-lab-foundation
  push:
    branches:
      - main
  schedule:
    # Weekly exact-main run so new RustSec advisories surface without a PR.
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Install pinned cargo-audit
        run: cargo +1.88.0 install cargo-audit --version 0.22.1 --locked
      - name: Audit locked dependencies
        run: cargo +1.88.0 audit -D warnings
      - name: Install pinned cargo-deny
        run: cargo +1.88.0 install cargo-deny --version 0.18.4 --locked
      - name: Check dependency licenses
        run: cargo +1.88.0 deny check licenses sources
      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Run focused Rust tests
        run: cargo +1.88.0 test --locked --all-targets
      - name: Run Clippy
        run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings
      - name: Build release binary
        run: cargo +1.88.0 build --locked --release
      - name: Validate staged installer, credential provisioning and rollback
        run: bash scripts/test-install.sh
      - name: Validate fail-closed agent control directory migration and recovery
        run: |
          bash -n scripts/migrate-agent-control-dir.sh
          bash -n scripts/test-agent-control-migration.sh
          bash scripts/test-agent-control-migration.sh
      - name: Validate the signed one-line installer interface
        run: bash scripts/test-quick-install.sh
      - name: Validate the interactive menu (staged, fa/en, arrow keys on a pty)
        run: bash scripts/test-menu.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate systemd encrypted credential delivery
        run: |
          bash -n scripts/pki/test-systemd-credential-runtime.sh
          bash scripts/pki/test-systemd-credential-runtime.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate installed systemd service lifecycle
        run: |
          bash -n scripts/pki/test-systemd-service-lifecycle.sh
          bash scripts/pki/test-systemd-service-lifecycle.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate CRL activation and rollback on systemd
        run: |
          bash -n scripts/pki/test-crl-activation-systemd.sh
          bash scripts/pki/test-crl-activation-systemd.sh
  ubuntu-2204-baseline:
    # Baseline gate: Ubuntu 22.04 / systemd 249 with LoadCredential= (no encrypted credentials).
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build release binary
        run: cargo +1.88.0 build --locked --release
      - name: Record host systemd version
        run: systemctl --version | head -n 1
      - name: Build the previous pre-release for the upgrade drill (R-001)
        run: |
          git fetch --depth=1 origin tag v0.1.0-phase1-pre
          git worktree add "$RUNNER_TEMP/old-release" v0.1.0-phase1-pre
          (cd "$RUNNER_TEMP/old-release" && cargo +1.88.0 build --locked --release)
      - name: Validate baseline LoadCredential= service lifecycle, upgrade and rollback
        run: |
          bash -n scripts/pki/test-systemd-baseline-lifecycle.sh
          bash scripts/pki/test-systemd-baseline-lifecycle.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel" "$RUNNER_TEMP/old-release/target/release/baft-tunnel"
      - name: Validate the agent control helper on real systemd (path units, permissions, start, stop, Apply start, rollback)
        run: |
          bash -n scripts/pki/test-agent-control-lifecycle.sh
          timeout 600 bash scripts/pki/test-agent-control-lifecycle.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate the agent service on real systemd (one-step install, own user, setup owners, Start/Restart/Stop with boot persistence, uninstall)
        run: |
          bash -n scripts/pki/test-agent-service-lifecycle.sh
          timeout 600 bash scripts/pki/test-agent-service-lifecycle.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate panel pairing on real systemd (setup mode, root setup helper, export/import with checksum, tamper refusals, Start)
        run: |
          bash -n scripts/pki/test-panel-pairing.sh
          timeout 600 bash scripts/pki/test-panel-pairing.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"

  panel-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Playwright
        run: 'npm install --prefix "$RUNNER_TEMP/baft-panel-qa" --no-save --no-audit --no-fund playwright@1.56.1'
      - name: Install Chromium
        # GitHub-hosted Ubuntu runners provide the OS libraries; avoid apt network
        # dependency resolution here and install only the pinned Playwright browser.
        run: '"$RUNNER_TEMP/baft-panel-qa/node_modules/.bin/playwright" install chromium'
      - name: Check panel JavaScript and real-host LAB script syntax
        run: |
          node --check panel/pages.js
          node --check panel/i18n.js
          node scripts/panel-qa/evidence-localization.js
          bash -n lab/real-hosts/panel-pairing-stage.sh
          bash scripts/pki/test-panel-tls-lab-stage.sh
      - name: Exercise panel PKI enrollment in English and Persian
        env:
          NODE_PATH: ${{ runner.temp }}/baft-panel-qa/node_modules
        run: node scripts/panel-qa/pki-enrollment.js

  offline-ca-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the network-isolated offline CA container
        run: bash scripts/pki/test-offline-ca-container.sh
