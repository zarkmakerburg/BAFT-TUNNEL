name: phase1-rust
on:
  pull_request:
    branches:
      - main
      - phase0/six-host-lab-foundation
  push:
    branches:
      - main
  schedule:
    # Weekly exact-main run so new RustSec advisories surface without a PR.
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Install pinned cargo-audit
        run: cargo +1.88.0 install cargo-audit --version 0.22.1 --locked
      - name: Audit locked dependencies
        run: cargo +1.88.0 audit -D warnings
      - name: Install pinned cargo-deny
        run: cargo +1.88.0 install cargo-deny --version 0.18.4 --locked
      - name: Check dependency licenses
        run: cargo +1.88.0 deny check licenses sources
      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Run focused Rust tests
        run: cargo +1.88.0 test --locked --all-targets
      - name: Run Clippy
        run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings
      - name: Build release binary
        run: cargo +1.88.0 build --locked --release
      - name: Validate staged installer, credential provisioning and rollback
        run: bash scripts/test-install.sh
      - name: Validate fail-closed agent control directory migration and recovery
        run: |
          bash -n scripts/migrate-agent-control-dir.sh
          bash -n scripts/install-agent-control.sh
          bash -n scripts/test-agent-control-migration.sh
          bash scripts/test-agent-control-migration.sh
      - name: Validate the signed one-line installer interface
        run: bash scripts/test-quick-install.sh
      - name: Validate the interactive menu (staged, fa/en, arrow keys on a pty)
        run: bash scripts/test-menu.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate systemd encrypted credential delivery
        run: |
          bash -n scripts/pki/test-systemd-credential-runtime.sh
          bash scripts/pki/test-systemd-credential-runtime.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate installed systemd service lifecycle
        run: |
          bash -n scripts/pki/test-systemd-service-lifecycle.sh
          bash scripts/pki/test-systemd-service-lifecycle.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate CRL activation and rollback on systemd
        run: |
          bash -n scripts/pki/test-crl-activation-systemd.sh
          bash scripts/pki/test-crl-activation-systemd.sh
  ubuntu-2204-baseline:
    # Baseline gate: Ubuntu 22.04 / systemd 249 with LoadCredential= (no encrypted credentials).
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build release binary
        run: cargo +1.88.0 build --locked --release
      - name: Record host systemd version
        run: systemctl --version | head -n 1
      - name: Validate control-directory migration on real systemd (two active, one inactive)
        run: |
          bash -n scripts/pki/test-agent-control-migration-systemd.sh
          sudo timeout 120 bash scripts/pki/test-agent-control-migration-systemd.sh
      - name: Build the previous Stable (v0.3.0) for the N-1 upgrade drill (R-001)
        run: |
          # The ledger's open Stable gate names exactly this: no cross-version upgrade evidence
          # against the released N-1 artifact. Build the released tag, do not substitute a
          # same-code digest, and fail if the built binary is not the release it claims to be.
          git fetch --depth=1 origin tag v0.3.0
          git worktree add "$RUNNER_TEMP/old-release" v0.3.0
          (cd "$RUNNER_TEMP/old-release" && cargo +1.88.0 build --locked --release)
          "$RUNNER_TEMP/old-release/target/release/baft-tunnel" --version
          "$RUNNER_TEMP/old-release/target/release/baft-tunnel" --version | grep -q '0\.3\.0' ||
            { echo 'the N-1 artifact does not report v0.3.0' >&2; exit 1; }
      - name: Validate baseline LoadCredential= service lifecycle, upgrade and rollback
        run: |
          bash -n scripts/pki/test-systemd-baseline-lifecycle.sh
          bash scripts/pki/test-systemd-baseline-lifecycle.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel" "$RUNNER_TEMP/old-release/target/release/baft-tunnel"
      - name: Validate the agent control helper on real systemd (path units, permissions, start, stop, Apply start, rollback)
        run: |
          bash -n scripts/pki/test-agent-control-lifecycle.sh
          timeout 600 bash scripts/pki/test-agent-control-lifecycle.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate the agent service on real systemd (one-step install, own user, setup owners, Start/Restart/Stop with boot persistence, uninstall)
        run: |
          bash -n scripts/pki/test-agent-service-lifecycle.sh
          timeout 600 bash scripts/pki/test-agent-service-lifecycle.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate panel pairing on real systemd (setup mode, root setup helper, export/import with checksum, tamper refusals, Start)
        run: |
          bash -n scripts/pki/test-panel-pairing.sh
          timeout 600 bash scripts/pki/test-panel-pairing.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate Fleet Hub provisioning and per-instance LoadCredential on real systemd
        run: |
          bash -n scripts/pki/test-fleet-hub-provision-systemd.sh
          sudo timeout 300 bash scripts/pki/test-fleet-hub-provision-systemd.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Test panel HTTPS front end on Ubuntu 22.04 nginx (own-CA issuance, auth pass-through, idempotence, rollback; certbot and systemctl shimmed)
        run: |
          bash -n scripts/panel-https.sh scripts/test-panel-https.sh
          sudo systemctl stop nginx apache2 2>/dev/null || true
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx
          sudo systemctl stop nginx 2>/dev/null || true
          sudo timeout 300 bash scripts/test-panel-https.sh
      - name: Test panel HTTPS with real certbot against a local Pebble ACME test CA (webroot challenge, issuance, nginx serves it)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq certbot
          D="$RUNNER_TEMP/pebble"; mkdir -p "$D"
          cat >"$D/pebble.json" <<'JSON'
          {"pebble":{"listenAddress":"0.0.0.0:14000","managementListenAddress":"0.0.0.0:15000","certificate":"/test/certs/localhost/cert.pem","privateKey":"/test/certs/localhost/key.pem","httpPort":80,"tlsPort":443,"ocspResponderURL":"","externalAccountBindingRequired":false}}
          JSON
          sudo docker run -d --name pebble --network host -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 \
            -v /etc/hosts:/etc/hosts:ro -v "$D/pebble.json:/cfg/pebble.json:ro" ghcr.io/letsencrypt/pebble:2.7.0 -config /cfg/pebble.json
          sudo docker cp pebble:/test/certs/pebble.minica.pem "$D/minica.pem"
          for i in $(seq 1 30); do curl -sk https://localhost:14000/dir >/dev/null && break; sleep 1; done
          sudo systemctl stop nginx 2>/dev/null || true
          sudo PANEL_TRACE=1 PEBBLE_CA="$D/minica.pem" timeout 240 bash -x scripts/test-panel-https.sh >"$D/out.txt" 2>"$D/trace.txt" </dev/null || true
          cat "$D/out.txt"
          grep -q PEBBLE_ACME=PASS "$D/out.txt" || { echo "--- trace tail"; tail -n 150 "$D/trace.txt" | cut -c1-250; ps -eo pid,etime,args | grep -E "certbot|nginx|curl|openssl|python" | grep -v grep | cut -c1-200; exit 1; }
      - name: Pebble logs on failure
        if: failure()
        run: sudo docker logs pebble 2>&1 | tail -40 || true

  ubuntu-2404-pipe-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: curl-pipe-bash survives apt and needrestart on Ubuntu 24.04, and panel HTTPS front end works on 24.04 nginx
        run: |
          bash -n scripts/test-pipe-install-2404.sh
          sudo timeout 300 bash scripts/test-pipe-install-2404.sh
          sudo systemctl stop nginx 2>/dev/null || true
          sudo apt-get install -y -qq nginx
          sudo systemctl stop nginx 2>/dev/null || true
          sudo timeout 300 bash scripts/test-panel-https.sh

  panel-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Playwright
        run: 'npm install --prefix "$RUNNER_TEMP/baft-panel-qa" --no-save --no-audit --no-fund playwright@1.56.1 axe-core@4.10.2'
      - name: Install Chromium
        # GitHub-hosted Ubuntu runners provide the OS libraries; avoid apt network
        # dependency resolution here and install only the pinned Playwright browser.
        run: '"$RUNNER_TEMP/baft-panel-qa/node_modules/.bin/playwright" install chromium'
      - name: Check panel JavaScript and real-host LAB script syntax
        run: |
          node --check panel/app.js
          node --check panel/ui.js
          node --check panel/pages.js
          node --check panel/i18n.js
          node --check scripts/panel-qa/lab-panel-live.js
          node --check scripts/panel-qa/auto-pairing.js
          node --check scripts/panel-qa/probe-card.js
          node --check scripts/panel-qa/pki-real-agent.js
          node --check scripts/panel-qa/lab-panel-pairing.js
          node scripts/panel-qa/evidence-localization.js
          bash -n lab/real-hosts/panel-pairing-stage.sh
          bash scripts/pki/test-panel-tls-lab-stage.sh
      - name: Exercise panel PKI enrollment in English and Persian
        env:
          NODE_PATH: ${{ runner.temp }}/baft-panel-qa/node_modules
        run: node scripts/panel-qa/pki-enrollment.js
      - name: Exercise automatic pairing flow in English and Persian
        env:
          NODE_PATH: ${{ runner.temp }}/baft-panel-qa/node_modules
        run: node scripts/panel-qa/auto-pairing.js
      - name: Automated accessibility audit (axe-core; critical/serious violations fail)
        env:
          NODE_PATH: ${{ runner.temp }}/baft-panel-qa/node_modules
        run: node scripts/panel-qa/a11y-axe.js

  panel-react:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Node version (Vite 7 needs 20.19 or newer)
        run: |
          node --version
          node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a<20||(a===20&&b<19)) { console.error('Node too old for Vite 7'); process.exit(1); }"
      - name: Install locked dependencies, type-check and build
        working-directory: panel-react
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
      - name: Committed dist must match the sources (rebuild and rerun npm run build, then commit panel-react/dist)
        run: git diff --exit-code -- panel-react/dist
      - name: Dist is self-contained
        working-directory: panel-react
        run: node scripts/check-dist.mjs
      - name: Production dependencies have no known vulnerabilities
        working-directory: panel-react
        run: npm audit --omit=dev --audit-level=low

  offline-ca-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the network-isolated offline CA container
        run: bash scripts/pki/test-offline-ca-container.sh
