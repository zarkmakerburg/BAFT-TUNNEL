name: phase1-rust
on:
  pull_request:
    branches:
      - main
      - phase0/six-host-lab-foundation
  push:
    branches:
      - phase1/rust-tcp-transport
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Run focused Rust tests
        run: cargo +1.85.0 test --locked --all-targets
      - name: Run Clippy
        run: cargo +1.85.0 clippy --locked --all-targets -- -D warnings
      - name: Build release binary
        run: cargo +1.85.0 build --locked --release
      - name: Validate systemd encrypted credential delivery
        run: |
          bash -n scripts/pki/test-systemd-credential-runtime.sh
          bash scripts/pki/test-systemd-credential-runtime.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
      - name: Validate installed systemd service lifecycle
        run: |
          bash -n scripts/pki/test-systemd-service-lifecycle.sh
          bash scripts/pki/test-systemd-service-lifecycle.sh "$GITHUB_WORKSPACE/target/release/baft-tunnel"
