name: release
# Publish only from an existing version tag. For a manual run, select the version tag
# in the GitHub Actions "Run workflow" ref selector.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional release notes (default: auto-generated)"
        type: string
        default: ""
      dry_run:
        description: "Build and hand over to the signing job, but do not sign or publish (any ref)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Audit A-06: building (third-party build scripts, Go modules, cargo-cyclonedx) runs in a job
  # without id-token, so nothing executed at build time can obtain the signing identity. The
  # signing job only checks out the tag, downloads dist/ and signs it.
  build:
    # Build on the oldest supported target (Ubuntu 22.04, glibc 2.35): a binary
    # linked on 24.04 needs GLIBC_2.39 and fails to start on 22.04 hosts (rc.3).
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read      # stable tags: required checks must be green on the tagged commit
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require a version tag on reviewed main history
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then echo "dry run: no tag required; nothing will be signed or published"; exit 0; fi
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::release workflow must run from a version tag; branch identities are not accepted"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD \
            || { echo "::error::$(git rev-parse HEAD) is not contained in main; release only reviewed commits"; exit 1; }
      - name: Resolve version and channel
        id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          test -f Cargo.toml || { echo "::error::Cargo.toml not found on this ref"; exit 1; }
          tag="$REF_NAME"
          if [[ "$DRY_RUN" == true ]]; then tag="v0.0.0-dryrun.$GITHUB_RUN_ID"; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid release tag"; exit 1; }
          case "$tag" in *-*) pre=true ;; *) pre=false ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - name: Require green required checks for a stable tag
        # Prerelease tags (vX.Y.Z-rc.N) are checked by tag-prerelease.yml before tagging and keep
        # their behaviour. A stable tag is pushed by hand, so check here (audit A-07).
        if: ${{ steps.v.outputs.prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          for check in rust ubuntu-2204-baseline lab-config; do
            ok="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=$check" \
              --jq '[.check_runs[]|select(.conclusion=="success")]|length')"
            [[ "$ok" -ge 1 ]] || { echo "::error::required check $check is not green on $sha; a stable release needs green reviewed main"; exit 1; }
          done
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build release binary
        run: cargo +1.88.0 build --locked --release
      - name: Stage artifacts
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          cp target/release/baft-tunnel "dist/baft-tunnel-${TAG}-linux-x86_64"
          # Refuse to publish a binary that needs a newer glibc than Ubuntu 22.04 ships.
          need="$(objdump -T target/release/baft-tunnel | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)"
          [ "$(printf '%s\n2.35\n' "$need" | sort -V | tail -1)" = "2.35" ] \
            || { echo "::error::baft-tunnel needs GLIBC_$need; supported floor is 2.35 (Ubuntu 22.04)"; exit 1; }
          echo "baft-tunnel glibc floor: GLIBC_$need"
      - name: Stage the install package (binary + operator scripts + units + quick-start)
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          name="baft-tunnel-${TAG}-linux-x86_64"
          root="$RUNNER_TEMP/pkg/$name"
          mkdir -p "$root/scripts/pki"
          install -m 0755 target/release/baft-tunnel "$root/baft-tunnel"
          # Same allowlist install.sh copies to /usr/local/lib/baft-tunnel: no tests or dev tooling.
          for f in scripts/*.sh scripts/pki/*.sh; do
            case "$(basename "$f")" in test-*|test.sh|apply-branch-protection.sh|build-baft-engine.sh|baft-validate-golden.sh) continue ;; esac
            install -m 0755 "$f" "$root/$f"
          done
          cp -R systemd "$root/systemd"
          install -m 0644 docs/quickstart.en.md "$root/QUICKSTART.en.md"
          install -m 0644 docs/quickstart.fa.md "$root/QUICKSTART.fa.md"
          chmod -R u=rwX,go=rX "$root"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "dist/${name}.tar.gz" -C "$RUNNER_TEMP/pkg" "$name"
          # Smoke: the extracted package installs into a staging root without the repo checkout.
          x="$RUNNER_TEMP/pkg-check"; mkdir -p "$x"
          tar -xzf "dist/${name}.tar.gz" -C "$x"
          bash "$x/$name/scripts/install.sh" --binary "$x/$name/baft-tunnel" \
            --destdir "$x/root" --systemd-version 249 >/dev/null
          cmp "$x/root/usr/local/bin/baft-tunnel" target/release/baft-tunnel
          for f in scripts/install.sh scripts/panel-https.sh scripts/menu.sh scripts/uninstall.sh scripts/install-agent-control.sh scripts/quick-install.sh \
                   scripts/pki/baft-pki.sh scripts/pki/push-crl.sh systemd/baft-tunnel@.service; do
            test -f "$x/root/usr/local/lib/baft-tunnel/$f" || { echo "::error::package install lacks $f"; exit 1; }
          done
          echo "package: $(tar -tzf "dist/${name}.tar.gz" | wc -l) entries, staged install OK"
      - name: Build, verify and stage the pinned BAFT engine (Engine #3)
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          scripts/build-baft-engine.sh "$RUNNER_TEMP/baft-out" >/dev/null
          want="$(python3 -c 'import json;m=json.load(open("release/engine-manifest.json"));print([e for e in m["engines"] if e["id"]=="baft"][0]["artifact_sha256"])')"
          have="$(sha256sum "$RUNNER_TEMP/baft-out/baft" | cut -d' ' -f1)"
          [ "$want" = "$have" ] || { echo "::error::engine build $have differs from engine-manifest.json $want"; exit 1; }
          cp "$RUNNER_TEMP/baft-out/baft" "dist/baft-engine-${tag}-linux-amd64"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "dist/baft-engine-${tag}-licenses.tar.gz" -C "$RUNNER_TEMP/baft-out" licenses
          cp release/engine-manifest.json "dist/engine-manifest-${tag}.json"
      - name: Generate SBOM (CycloneDX)
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          cargo +1.88.0 install cargo-cyclonedx --version 0.5.7 --locked
          cargo +1.88.0 cyclonedx --format json --override-filename sbom
          mv sbom.json "dist/baft-tunnel-${TAG}.sbom.cdx.json"
      - name: Hand the unsigned artifacts to the signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: release-dist-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # keyless signing via GitHub OIDC (no private key anywhere)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Receive the artifacts built from this ref
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4.3.0
        with:
          name: release-dist-unsigned
          path: dist
      - name: Check the hand-over is complete
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          for f in "baft-tunnel-${TAG}-linux-x86_64" "baft-tunnel-${TAG}-linux-x86_64.tar.gz" \
                   "baft-engine-${TAG}-linux-amd64" "baft-engine-${TAG}-licenses.tar.gz" \
                   "engine-manifest-${TAG}.json" "baft-tunnel-${TAG}.sbom.cdx.json"; do
            [[ -f "dist/$f" && ! -L "dist/$f" ]] || { echo "::error::missing release artifact $f"; exit 1; }
          done
          [[ "$(find dist -mindepth 1 | wc -l)" == 6 ]] || { echo "::error::unexpected files in the hand-over"; exit 1; }
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - if: ${{ !inputs.dry_run }}
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.3
      - name: Sign SHA256SUMS (keyless, GitHub OIDC)
        if: ${{ !inputs.dry_run }}
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
      - name: Self-verify before publishing
        if: ${{ !inputs.dry_run }}
        working-directory: dist
        env:
          ID: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml
        run: |
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.cosign.bundle \
            --certificate-identity "${ID}@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum -c SHA256SUMS
      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRE: ${{ needs.build.outputs.prerelease }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          flags=(--title "$TAG" --target "$(git rev-parse HEAD)")
          if [ -n "$NOTES" ]; then flags+=(--notes "$NOTES"); else flags+=(--generate-notes); fi
          [ "$PRE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* "${flags[@]}"
      - name: Verify the published release through the public quick installer
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/quick-install.sh --verify-only --tag "$TAG"
