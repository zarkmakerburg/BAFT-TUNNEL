name: LAB bench E3 (BAFT-TUNNEL tcp-tls Direct, integrity + throughput over the real path)

# E3 = the real Iran <-> abroad LAB path. Runs the signed release binary (checked against SHA256SUMS)
# with a THROWAWAY 2-day PKI created on the runner, entirely under a temp dir on both hosts:
# no install, no systemd, no firewall/route/sysctl change, no CAP_NET_ADMIN. Per round it sends a
# deterministic stream Iran -> abroad through the tunnel and compares SHA-256 (bench/harness.py).
# Optionally every Nth round kills the Iran forward process mid-transfer (expected verdict: truncated;
# no tunnel resumes streams yet). Hosts are shared: one run at a time (concurrency group). No secrets printed.
# Evidence level: LAB only for this path and time window; says nothing about other paths or production.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to test (must have a linux-x86_64 asset and SHA256SUMS)
        required: false
        type: string
        default: 'v0.3.0-rc.1'
      port:
        description: TCP port the abroad host accepts from the Iran host (must already be reachable, unused)
        required: false
        type: string
        default: '8443'
      size_mib:
        description: Stream size per round in MiB (16-512)
        required: false
        type: string
        default: '128'
      rounds:
        description: Number of rounds (1-48)
        required: false
        type: string
        default: '12'
      interval_s:
        description: Pause between rounds in seconds (30-1800)
        required: false
        type: string
        default: '600'
      kill_every:
        description: Every Nth round kill the Iran forward process mid-transfer (0 = never)
        required: false
        type: string
        default: '4'
      confirm:
        description: Type RUN_LAB_BENCH_E3 to authorize the isolated two-host benchmark
        required: true
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: baft-tunnel-trusted-lab-hosts
  cancel-in-progress: false

jobs:
  e3:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    environment: baft-tunnel-lab
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run E3
        env:
          CONFIRM: ${{ inputs.confirm }}
          VERSION: ${{ inputs.version }}
          PORT: ${{ inputs.port }}
          SIZE: ${{ inputs.size_mib }}
          ROUNDS: ${{ inputs.rounds }}
          INTERVAL: ${{ inputs.interval_s }}
          KILL_EVERY: ${{ inputs.kill_every }}
          LAB_IRAN_HOST: ${{ secrets.LAB_IRAN_HOST }}
          LAB_ABROAD_HOST: ${{ secrets.LAB_ABROAD_HOST }}
          LAB_SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          LAB_SSH_KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
          LAB_IRAN_SSH_USER: ${{ vars.LAB_IRAN_SSH_USER }}
          LAB_ABROAD_SSH_USER: ${{ vars.LAB_ABROAD_SSH_USER }}
          LAB_IRAN_SSH_PORT: ${{ vars.LAB_IRAN_SSH_PORT }}
          LAB_ABROAD_SSH_PORT: ${{ vars.LAB_ABROAD_SSH_PORT }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == RUN_LAB_BENCH_E3 ]] || { echo "confirmation missing" >&2; exit 2; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "bad version" >&2; exit 2; }
          [[ "$PORT" =~ ^[0-9]{4,5}$ && "$SIZE" =~ ^[0-9]+$ && "$ROUNDS" =~ ^[0-9]+$ && "$INTERVAL" =~ ^[0-9]+$ && "$KILL_EVERY" =~ ^[0-9]+$ ]] || { echo "bad numeric input" >&2; exit 2; }
          (( PORT >= 1024 && PORT <= 65535 && SIZE >= 16 && SIZE <= 512 && ROUNDS >= 1 && ROUNDS <= 48 && INTERVAL >= 30 && INTERVAL <= 1800 && KILL_EVERY <= ROUNDS )) || { echo "input out of range" >&2; exit 2; }
          (( ROUNDS * (INTERVAL + 120) <= 19500 )) || { echo "planned duration exceeds the 5.4 h cap" >&2; exit 2; }
          W="$RUNNER_TEMP/e3"; mkdir -p "$W"; cd "$W"
          BU=https://github.com/zarkmakerburg/BAFT-TUNNEL/releases/download/$VERSION
          curl -fsSL -o baft-tunnel "$BU/baft-tunnel-$VERSION-linux-x86_64"; curl -fsSL -o SUMS "$BU/SHA256SUMS"
          SHA=$(sha256sum baft-tunnel | cut -d' ' -f1)
          grep -q "$SHA  baft-tunnel-$VERSION-linux-x86_64" SUMS || { echo "checksum mismatch" >&2; exit 3; }
          chmod +x baft-tunnel
          d=/tmp/baft-e3-$GITHUB_RUN_ID
          GEN_ONLY=1 "$GITHUB_WORKSPACE/bench/baft_up.sh" "$W/pki" "$d/baft-tunnel" "0.0.0.0:$PORT" "ABROAD_ADDR:$PORT" 127.0.0.1:39001 127.0.0.1:5204 "" ""
          sed -i "s/ABROAD_ADDR/$LAB_ABROAD_HOST/g" "$W/pki/forward.cmd"
          key="$RUNNER_TEMP/e3-id"; kh="$RUNNER_TEMP/e3-kh"
          printf '%s\n' "$LAB_SSH_PRIVATE_KEY" > "$key"; printf '%s\n' "$LAB_SSH_KNOWN_HOSTS" > "$kh"
          chmod 0600 "$key" "$kh"; unset LAB_SSH_PRIVATE_KEY LAB_SSH_KNOWN_HOSTS
          opts=(-i "$key" -o UserKnownHostsFile="$kh" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15)
          ir=(ssh "${opts[@]}" -p "${LAB_IRAN_SSH_PORT:-22}" "$LAB_IRAN_SSH_USER@$LAB_IRAN_HOST")
          ab=(ssh "${opts[@]}" -p "${LAB_ABROAD_SSH_PORT:-22}" "$LAB_ABROAD_SSH_USER@$LAB_ABROAD_HOST")
          cleanup() {
            "${ir[@]}" "pkill -f '$d/[b]aft-tunnel'; pkill -f '$d/[h]arness.py'; rm -rf $d" >/dev/null 2>&1 || true
            "${ab[@]}" "pkill -f '$d/[b]aft-tunnel'; pkill -f '$d/[h]arness.py'; rm -rf $d" >/dev/null 2>&1 || true
            rm -f "$key" "$kh"
            echo "cleanup done $(date -u +%H:%M:%SZ)"
          }
          trap cleanup EXIT
          echo "E3 start $(date -u +%H:%M:%SZ) version=$VERSION sha256=$SHA size=${SIZE}MiB rounds=$ROUNDS interval=${INTERVAL}s kill_every=$KILL_EVERY"
          [[ "$("${ab[@]}" "ss -ltn 'sport = :$PORT' | tail -n +2 | wc -l")" == 0 ]] || { echo "abroad port $PORT already in use; abort" >&2; exit 4; }
          for h in ab ir; do
            if [[ $h == ab ]]; then c=("${ab[@]}"); n=exit; f=serve.cmd; else c=("${ir[@]}"); n=entry; f=forward.cmd; fi
            "${c[@]}" "mkdir -m 700 $d"
            tar -C "$W/pki" -cf - $n.key $n.crt ca.crt ca.crl $f | "${c[@]}" "tar -C $d -xf -"
            "${c[@]}" "cat > $d/baft-tunnel; chmod 700 $d/baft-tunnel" < baft-tunnel
            "${c[@]}" "cat > $d/harness.py" < "$GITHUB_WORKSPACE/bench/harness.py"
          done
          "${ab[@]}" "cd $d && nohup bash serve.cmd > serve.log 2>&1 < /dev/null &"; sleep 2
          "${ir[@]}" "cd $d && nohup bash forward.cmd > forward.log 2>&1 < /dev/null &"; sleep 4
          : > "$W/rounds.jsonl"
          for r in $(seq 1 "$ROUNDS"); do
            km=0; (( KILL_EVERY > 0 && r % KILL_EVERY == 0 )) && km=1
            "${ab[@]}" "rm -f $d/sink.json; cd $d && nohup python3 harness.py --role sink --size-mib $SIZE --idle 60 --json $d/sink.json > /dev/null 2>&1 < /dev/null &"
            sleep 2
            if (( km )); then
              "${ir[@]}" "nohup bash -c 'sleep 3; pkill -KILL -f \"$d/[b]aft-tunnel forward\"; sleep 1; cd $d; bash forward.cmd > forward-r$r.log 2>&1' > /dev/null 2>&1 < /dev/null &"
            fi
            t0=$(date -u +%H:%M:%SZ)
            "${ir[@]}" "cd $d && timeout 1500 python3 harness.py --role send --size-mib $SIZE --target 127.0.0.1:5204 --json $d/send.json > /dev/null 2>&1; cat $d/send.json 2>/dev/null || echo '{}'" > "$W/send.json" || echo '{}' > "$W/send.json"
            for i in $(seq 1 40); do "${ab[@]}" "test -s $d/sink.json" && break; sleep 3; done
            "${ab[@]}" "cat $d/sink.json 2>/dev/null || echo '{}'" > "$W/sink.json" || echo '{}' > "$W/sink.json"
            alive_ab=$("${ab[@]}" "pgrep -fc '$d/[b]aft-tunnel serve'" || true); alive_ir=$("${ir[@]}" "pgrep -fc '$d/[b]aft-tunnel forward'" || true)
            rss_ab=$("${ab[@]}" "ps -eo rss,args | awk '/[b]aft-tunnel serve/{print \$1; exit}'" || true); rss_ir=$("${ir[@]}" "ps -eo rss,args | awk '/[b]aft-tunnel forward/{print \$1; exit}'" || true)
            python3 - "$r" "$km" "$t0" "${alive_ab:-0}" "${alive_ir:-0}" "${rss_ab:-0}" "${rss_ir:-0}" "$W" >> "$W/rounds.jsonl" <<'P'
          import json,sys
          r,km,t0,aab,air,rab,rir,W=sys.argv[1:9]
          def L(n):
              try: return json.load(open(f"{W}/{n}.json"))
              except Exception: return {}
          s,d=L("sink"),L("send")
          ok = bool(d) and s.get("received",0)>0 and s.get("sha_received")==d.get("sha_expected_of_full_stream")
          v = "correct" if ok else ("NO-DATA/harness-failure" if not d or s.get("received",0)==0 else "truncated" if s.get("received",0) < d.get("size_bytes",1) else "corrupt")
          dur = d.get("duration_s")
          mibs = round(s.get("received",0)/1048576/dur,1) if dur else None
          print(json.dumps({"round":int(r),"start_utc":t0,"killed_forward":km=="1","verdict":v,"received_MiB":round(s.get("received",0)/1048576,1),"send_s":dur,"MiB_per_s":mibs,"retries":d.get("retries"),"serve_alive":aab,"forward_alive":air,"serve_rss_KiB":rab,"forward_rss_KiB":rir}))
          P
            tail -n 1 "$W/rounds.jsonl"
            (( r < ROUNDS )) && sleep "$INTERVAL"
          done
          {
            echo "## E3 LAB: BAFT-TUNNEL $VERSION tcp-tls Direct (real path, one window; LAB-level evidence only)"
            echo "Throwaway PKI, no install/firewall/route/sysctl change, Iran forward -> abroad serve, ${SIZE} MiB per round, kill_every=$KILL_EVERY. Throughput is sender-side over the real path at that moment and varies with the path; not a production figure."
            echo '| round | start (UTC) | killed fwd | verdict | received MiB | send s | MiB/s | retries | serve/fwd alive | RSS KiB (serve/fwd) |'; echo '|---|---|---|---|---|---|---|---|---|---|'
            python3 - "$W/rounds.jsonl" <<'P'
          import json,sys
          for l in open(sys.argv[1]):
              x=json.loads(l); print(f"| {x['round']} | {x['start_utc']} | {x['killed_forward']} | {x['verdict']} | {x['received_MiB']} | {x['send_s']} | {x['MiB_per_s']} | {x['retries']} | {x['serve_alive']}/{x['forward_alive']} | {x['serve_rss_KiB']}/{x['forward_rss_KiB']} |")
          P
          } >> "$GITHUB_STEP_SUMMARY"
