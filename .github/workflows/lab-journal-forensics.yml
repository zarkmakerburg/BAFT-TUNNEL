name: LAB journal forensics (read-only)

# Reads persisted journald entries of BAFT-TUNNEL units and the kernel from both LAB hosts for a
# bounded UTC window, to explain a past LAB failure. Read-only: no install, restart or config change.
on:
  workflow_dispatch:
    inputs:
      since:
        description: Window start, UTC (YYYY-MM-DD HH:MM:SS)
        required: true
        type: string
      until:
        description: Window end, UTC (YYYY-MM-DD HH:MM:SS), at most 30 minutes after since
        required: true
        type: string
      confirm:
        description: Type READ_LAB_JOURNALS to authorize read-only SSH to both LAB hosts
        required: true
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: baft-tunnel-trusted-lab-hosts
  cancel-in-progress: false

jobs:
  read-journals:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    environment: baft-tunnel-lab
    timeout-minutes: 10
    steps:
      - name: Validate inputs
        env:
          CONFIRM: ${{ inputs.confirm }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == READ_LAB_JOURNALS ]] || { echo "confirmation missing" >&2; exit 1; }
          re='^20[0-9]{2}-[01][0-9]-[0-3][0-9] [0-2][0-9]:[0-5][0-9]:[0-5][0-9]$'
          [[ "$SINCE" =~ $re && "$UNTIL" =~ $re ]] || { echo "since/until must be YYYY-MM-DD HH:MM:SS" >&2; exit 1; }
          s=$(date -u -d "$SINCE" +%s); u=$(date -u -d "$UNTIL" +%s)
          (( u > s && u - s <= 1800 )) || { echo "window must be positive and at most 30 minutes" >&2; exit 1; }
      - name: Read BAFT-TUNNEL unit and kernel journals on both hosts
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          LAB_IRAN_HOST: ${{ secrets.LAB_IRAN_HOST }}
          LAB_ABROAD_HOST: ${{ secrets.LAB_ABROAD_HOST }}
          LAB_SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          LAB_SSH_KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
          LAB_IRAN_SSH_USER: ${{ vars.LAB_IRAN_SSH_USER }}
          LAB_ABROAD_SSH_USER: ${{ vars.LAB_ABROAD_SSH_USER }}
          LAB_IRAN_SSH_PORT: ${{ vars.LAB_IRAN_SSH_PORT }}
          LAB_ABROAD_SSH_PORT: ${{ vars.LAB_ABROAD_SSH_PORT }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/forensics-id"; kh="$RUNNER_TEMP/forensics-kh"
          printf '%s\n' "$LAB_SSH_PRIVATE_KEY" > "$key"; printf '%s\n' "$LAB_SSH_KNOWN_HOSTS" > "$kh"
          chmod 0600 "$key" "$kh"; unset LAB_SSH_PRIVATE_KEY LAB_SSH_KNOWN_HOSTS
          trap 'rm -f "$key" "$kh"' EXIT
          # Keep the leading timestamp token (HH:MM:SS looks like IPv6) and mask addresses in the rest.
          mask() { perl -pe 'my ($t, $r) = /^(\S*)(.*)$/s; $r =~ s/\b\d{1,3}(?:\.\d{1,3}){3}\b/<ip>/g; $r =~ s/(?:[0-9a-fA-F]{0,4}:){2,7}[0-9a-fA-F]{1,4}\b/<ip6>/g; $_ = $t . $r;'; }
          remote="journalctl --list-boots --no-pager | tail -5
          echo '--- baft-tunnel units (without per-stream lines) ---'
          journalctl -u 'baft-tunnel*' --since '$SINCE UTC' --until '$UNTIL UTC' --no-pager -o short-iso-precise --utc | grep -vE 'yamux stream (accepted|opened)|fixed destination connected|E2E_PAYLOAD_OK' | tail -200
          echo '--- kernel ---'
          journalctl -k --since '$SINCE UTC' --until '$UNTIL UTC' --no-pager -o short-iso-precise --utc | tail -60
          echo '--- other units with warnings or errors ---'
          journalctl -p warning --since '$SINCE UTC' --until '$UNTIL UTC' --no-pager -o short-iso-precise --utc | grep -v 'baft-tunnel' | tail -60"
          for side in iran abroad; do
            if [[ $side == iran ]]; then h="$LAB_IRAN_HOST"; u="$LAB_IRAN_SSH_USER"; p="$LAB_IRAN_SSH_PORT"; else h="$LAB_ABROAD_HOST"; u="$LAB_ABROAD_SSH_USER"; p="$LAB_ABROAD_SSH_PORT"; fi
            echo "=================== $side ==================="
            ssh -i "$key" -o UserKnownHostsFile="$kh" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -p "${p:-22}" "$u@$h" "$remote" 2>&1 | mask || echo "read failed on $side"
          done
