name: one-time-noise-validation
on:
  push:
    branches:
      - phase1/rust-tcp-transport
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/noise.rs
      - .github/workflows/one-time-noise-validation.yml
permissions:
  contents: write
jobs:
  lock-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Generate and commit lockfile
        run: |
          cargo +1.85.0 generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "deps: lock Noise transport dependency"
            git push
          fi
      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Run focused Rust tests
        run: cargo +1.85.0 test --locked --all-targets
      - name: Run Clippy
        run: cargo +1.85.0 clippy --locked --all-targets -- -D warnings
      - name: Build release binary
        run: cargo +1.85.0 build --locked --release
