name: Iran LAB port 19090 process context diagnostic (read-only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type READ_ONLY_IRAN_PORT_19090_PROCESS_CONTEXT to inspect only the existing TCP/19090 owner on the Iran LAB host
        required: true
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: baft-tunnel-trusted-lab-hosts
  cancel-in-progress: false

jobs:
  validate-confirmation:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require exact task-specific confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "READ_ONLY_IRAN_PORT_19090_PROCESS_CONTEXT" ]] || {
            echo "Invalid confirmation; no LAB host was contacted." >&2
            exit 2
          }

  inspect-iran-process:
    needs: validate-confirmation
    runs-on: ubuntu-24.04
    environment: baft-tunnel-lab
    timeout-minutes: 5
    env:
      LAB_IRAN_HOST: ${{ secrets.LAB_IRAN_HOST }}
      LAB_IRAN_SSH_USER: ${{ vars.LAB_IRAN_SSH_USER }}
      LAB_IRAN_SSH_PORT: ${{ vars.LAB_IRAN_SSH_PORT }}
    steps:
      - name: Prepare ephemeral pinned SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing LAB_SSH_PRIVATE_KEY' >&2; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing LAB_SSH_KNOWN_HOSTS' >&2; exit 2; }
          test -n "$LAB_IRAN_HOST" || { echo 'Missing LAB_IRAN_HOST' >&2; exit 2; }
          echo "::add-mask::$LAB_IRAN_HOST"
          mkdir -p "$RUNNER_TEMP/baft-tunnel-process-context"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/baft-tunnel-process-context/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/baft-tunnel-process-context/known_hosts"
          chmod 600 "$RUNNER_TEMP/baft-tunnel-process-context/id_ed25519" "$RUNNER_TEMP/baft-tunnel-process-context/known_hosts"
          echo "SSH_KEY_FILE=$RUNNER_TEMP/baft-tunnel-process-context/id_ed25519" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/baft-tunnel-process-context/known_hosts" >> "$GITHUB_ENV"

      - name: Read executable, script, unit and bounded ancestry for Iran TCP/19090 owner
        shell: bash
        run: |
          set -Eeuo pipefail
          user="${LAB_IRAN_SSH_USER:-root}"
          port="${LAB_IRAN_SSH_PORT:-22}"
          [[ "$user" =~ ^[A-Za-z_][A-Za-z0-9_.-]*[$]?$ ]] || { echo 'Invalid LAB_IRAN_SSH_USER' >&2; exit 2; }
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 )) || { echo 'Invalid LAB_IRAN_SSH_PORT' >&2; exit 2; }
          ssh -i "$SSH_KEY_FILE" -p "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 -o LogLevel=ERROR \
            "$user@$LAB_IRAN_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          command -v ss >/dev/null 2>&1 || { echo 'PORT_DIAGNOSTIC=ss_unavailable'; exit 3; }
          raw="$(ss -lntpH 'sport = :19090' 2>/dev/null)"
          if [[ -z "$raw" ]]; then
            echo 'PORT_19090_STATE=not-listening'
            exit 0
          fi
          pids="$(printf '%s\n' "$raw" | python3 -c 'import re,sys; print(" ".join(sorted(set(re.findall(r"pid=(\d+)", sys.stdin.read())))))')"
          if [[ -z "$pids" ]]; then
            echo 'PORT_19090_STATE=listening'
            echo 'PROCESS_OWNER_VISIBILITY=insufficient'
            exit 0
          fi
          PORT_OWNER_PIDS="$pids" python3 <<'PY'
          import os, re

          def read_text(path):
              try:
                  with open(path, "r", encoding="utf-8", errors="replace") as f:
                      return f.read()
              except Exception:
                  return ""

          def safe(value, limit=240):
              value = str(value).replace("\x00", "").replace("\n", " ").replace("\r", " ")
              value = "".join(ch if ch.isprintable() else "_" for ch in value)
              return value[:limit] or "unavailable"

          def details(pid, parse_python=False):
              base = f"/proc/{pid}"
              comm = safe(read_text(base + "/comm").strip(), 80)
              try:
                  exe = safe(os.readlink(base + "/exe"), 240)
              except Exception:
                  exe = "unavailable"
              script = "unavailable"
              mode = "not-python-or-unavailable"
              if parse_python:
                  try:
                      raw = open(base + "/cmdline", "rb").read()
                      argv = [x.decode("utf-8", "replace") for x in raw.split(b"\x00") if x]
                  except Exception:
                      argv = []
                  if argv and ("python" in os.path.basename(argv[0]).lower()):
                      mode = "unclassified-python-arguments"
                      i = 1
                      no_value = {"-b", "-B", "-d", "-E", "-h", "-i", "-I", "-O", "-OO", "-P", "-q", "-R", "-s", "-S", "-u", "-v", "-V", "-x"}
                      while i < len(argv):
                          arg = argv[i]
                          if arg == "-":
                              mode, script = "stdin-program-suppressed", "not-disclosed"
                              break
                          if arg == "-c":
                              mode, script = "inline-code-suppressed", "not-disclosed"
                              break
                          if arg == "-m" and i + 1 < len(argv):
                              mode, script = "module", safe(argv[i + 1], 180)
                              break
                          if arg in {"-W", "-X"}:
                              i += 2
                              continue
                          if (arg.startswith("-W") or arg.startswith("-X")) and len(arg) > 2:
                              i += 1
                              continue
                          if arg == "--check-hash-based-pycs":
                              i += 2
                              continue
                          if arg.startswith("--check-hash-based-pycs="):
                              i += 1
                              continue
                          if arg in no_value:
                              i += 1
                              continue
                          if arg == "--":
                              i += 1
                              if i < len(argv):
                                  candidate = argv[i]
                                  if os.path.isabs(candidate):
                                      resolved = os.path.realpath(candidate)
                                  else:
                                      try:
                                          cwd = os.readlink(base + "/cwd")
                                          resolved = os.path.realpath(os.path.join(cwd, candidate))
                                      except Exception:
                                          resolved = ""
                                  mode, script = ("script", safe(resolved, 240)) if resolved else ("script-path-unavailable", "unavailable")
                              else:
                                  mode, script = "interactive-or-stdin", "not-disclosed"
                              break
                          if arg.startswith("-"):
                              mode, script = "unclassified-option-suppressed", "not-disclosed"
                              break
                          if os.path.isabs(arg):
                              resolved = os.path.realpath(arg)
                          else:
                              try:
                                  cwd = os.readlink(base + "/cwd")
                                  resolved = os.path.realpath(os.path.join(cwd, arg))
                              except Exception:
                                  resolved = ""
                          mode, script = ("script", safe(resolved, 240)) if resolved else ("script-path-unavailable", "unavailable")
                          break
                      else:
                          mode, script = "interactive-or-stdin", "not-disclosed"
              cgroup = read_text(base + "/cgroup")
              units = re.findall(r"([^/]+\.(?:service|scope|slice))", cgroup)
              unit = safe(units[-1], 120) if units else "not-visible"
              cgroup_kind = "systemd" if "system.slice" in cgroup or "user.slice" in cgroup else ("container-or-other" if cgroup else "unavailable")
              return {"comm": comm, "exe": exe, "mode": mode, "script": script, "unit": unit, "cgroup_kind": cgroup_kind}

          print("PORT_19090_STATE=listening")
          seen = set()
          for owner in os.environ.get("PORT_OWNER_PIDS", "").split():
              if not owner.isdigit() or owner in seen:
                  continue
              seen.add(owner)
              info = details(owner, parse_python=True)
              print("OWNER_PROCESS_NAME=" + info["comm"])
              print("OWNER_EXECUTABLE=" + info["exe"])
              print("OWNER_PYTHON_MODE=" + info["mode"])
              print("OWNER_SCRIPT_OR_MODULE=" + info["script"])
              print("OWNER_SYSTEMD_UNIT=" + info["unit"])
              print("OWNER_CGROUP_CLASS=" + info["cgroup_kind"])
              try:
                  ppid = int(read_text(f"/proc/{owner}/stat").split(") ", 1)[1].split()[1])
              except Exception:
                  ppid = 0
              depth = 0
              while ppid > 1 and depth < 5:
                  parent = details(str(ppid))
                  print(f"PARENT_{depth+1}_PROCESS_NAME=" + parent["comm"])
                  print(f"PARENT_{depth+1}_EXECUTABLE=" + parent["exe"])
                  print(f"PARENT_{depth+1}_SYSTEMD_UNIT=" + parent["unit"])
                  try:
                      ppid = int(read_text(f"/proc/{ppid}/stat").split(") ", 1)[1].split()[1])
                  except Exception:
                      break
                  depth += 1
          print("RAW_ARGUMENTS=not_disclosed")
          print("ENVIRONMENT_VARIABLES=not_read")
          PY
          REMOTE

      - name: Remove ephemeral credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/baft-tunnel-process-context"
