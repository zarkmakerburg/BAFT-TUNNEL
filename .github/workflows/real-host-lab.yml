name: Real-host LAB (manual, read-only preflight)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type READ_ONLY_PREFLIGHT to connect to the six configured LAB hosts
        required: true
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: baft-tunnel-real-host-lab
  cancel-in-progress: false

jobs:
  real-host-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'READ_ONLY_PREFLIGHT' }}
    runs-on: ubuntu-latest
    environment: baft-tunnel-lab
    timeout-minutes: 15
    env:
      IR_1_HOST: ${{ vars.IR_1_HOST }}
      IR_2_HOST: ${{ vars.IR_2_HOST }}
      EX_1_HOST: ${{ vars.EX_1_HOST }}
      EX_2_HOST: ${{ vars.EX_2_HOST }}
      EX_3_HOST: ${{ vars.EX_3_HOST }}
      EX_4_HOST: ${{ vars.EX_4_HOST }}
      SSH_USER: ${{ vars.LAB_SSH_USER }}
      SSH_PORT: ${{ vars.LAB_SSH_PORT }}
      LAB_TEST_PORTS: ${{ vars.LAB_TEST_PORTS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Prepare ephemeral SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing secret LAB_SSH_PRIVATE_KEY' >&2; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing secret LAB_SSH_KNOWN_HOSTS' >&2; exit 2; }
          for host in "$IR_1_HOST" "$IR_2_HOST" "$EX_1_HOST" "$EX_2_HOST" "$EX_3_HOST" "$EX_4_HOST"; do
            test -n "$host" || { echo 'Missing one or more host variables in baft-tunnel-lab environment' >&2; exit 2; }
            echo "::add-mask::$host"
          done
          mkdir -p "$RUNNER_TEMP/baft-tunnel-ssh"
          printf '%s\\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519"
          printf '%s\\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/baft-tunnel-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519" "$RUNNER_TEMP/baft-tunnel-ssh/known_hosts"
          echo "SSH_KEY_FILE=$RUNNER_TEMP/baft-tunnel-ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/baft-tunnel-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Run read-only six-host matrix preflight
        run: bash lab/real-hosts/preflight-matrix.sh
      - name: Remove ephemeral credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/baft-tunnel-ssh"
