[package]
name = "baft-tunnel-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "LicenseRef-Proprietary"

[package.metadata]
cargo-fuzz = true

# Same dependency versions as the main crate (Cargo.toml); keep the two lists in sync.
[dependencies]
libfuzzer-sys = "0.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = "0.4"
libc = "0.2"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snow = "0.9.6"
tokio = { version = "1.48", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-yamux = "0.3.20"
x509-parser = "=0.16.0"

[workspace]

[[bin]]
name = "config_json"
path = "fuzz_targets/config_json.rs"
test = false
doc = false

[[bin]]
name = "pairing_bundle"
path = "fuzz_targets/pairing_bundle.rs"
test = false
doc = false

[[bin]]
name = "agent_http"
path = "fuzz_targets/agent_http.rs"
test = false
doc = false

[[bin]]
name = "handshake_server"
path = "fuzz_targets/handshake_server.rs"
test = false
doc = false
