# Root-owned parent for helper replay receipts. Helpers create their private 0700 leaf directories.
d /var/lib/baft-tunnel-control 0700 root root -
# Only the dedicated agent account may submit setup requests. The tunnel engine runs as
# baft-tunnel and must not share this group: a compromised engine must not be able to ask
# the root helper to run setup init/join. The agent's primary group is baft-tunnel-agent.
d /run/baft-tunnel/control 0770 root baft-tunnel-agent -
# Also repair ownership/mode on an existing directory during upgrades (d alone is create-only).
z /run/baft-tunnel/control 0770 root baft-tunnel-agent -
